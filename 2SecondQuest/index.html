    <script>
        var codigo = Number(prompt("Digite o código do produto:"));

        switch (codigo) {
            case 1:
                document.write("Produto: Cachorro quente<br>");
                document.write("Valor: R$ 8,00");
                break;

            case 2:
                document.write("Produto: Cheeseburger<br>");
                document.write("Valor: R$ 12,00");
                break;

            case 3:
                document.write("Produto: X-Salada<br>");
                document.write("Valor: R$ 15,00");
                break;

            case 4:
                document.write("Produto: Misto Quente<br>");
                document.write("Valor: R$ 11,00");
                break;

            case 5:
                document.write("Produto: Pão na chapa<br>");
                document.write("Valor: R$ 6,00");
                break;

            default:
                document.write("Código de produto inválido.");
        }
    </script>
