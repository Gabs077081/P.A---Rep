
    <script>
        var dia = Number(prompt("Digite o dia que nasceu:"));
        var mes = Number(prompt("Digite o mês que nasceu:"));

        switch (mes) {
            case 1:
                if (dia <= 19) {
                    document.write("Capricórnio");
                } else {
                    document.write("Aquário");
                }
                break;

            case 2:
                if (dia <= 19) {
                    document.write("Aquário");
                } else {
                    document.write("Peixes");
                }
                break;

            case 3:
                if (dia <= 20) {
                    document.write("Peixes");
                } else {
                    document.write("Áries");
                }
                break;

            case 4:
                if (dia <= 20) {
                    document.write("Áries");
                } else {
                    document.write("Touro");
                }
                break;

            case 5:
                if (dia <= 20) {
                    document.write("Touro");
                } else {
                    document.write("Gêmeos");
                }
                break;

            case 6:
                if (dia <= 20) {
                    document.write("Gêmeos");
                } else {
                    document.write("Câncer");
                }
                break;

            case 7:
                if (dia <= 22) {
                    document.write("Câncer");
                } else {
                    document.write("Leão");
                }
                break;

            case 8:
                if (dia <= 22) {
                    document.write("Leão");
                } else {
                    document.write("Virgem");
                }
                break;

            case 9:
                if (dia <= 22) {
                    document.write("Virgem");
                } else {
                    document.write("Libra");
                }
                break;

            case 10:
                if (dia <= 22) {
                    document.write("Libra");
                } else {
                    document.write("Escorpião");
                }
                break;

            case 11:
                if (dia <= 21) {
                    document.write("Escorpião");
                } else {
                    document.write("Sagitário");
                }
                break;

            case 12:
                if (dia <= 21) {
                    document.write("Sagitário");
                } else {
                    document.write("Capricórnio");
                }
                break;

            default:
                document.write("Mês inválido.");
        }
    </script>
