<!DOCTYPE html>
<html>
<head>
    <title>Questão A</title>
</head>
<body>

<script>
    let joao = 1.34;
    let pedro = 1.45;
    let anos = 0;

    while (joao <= pedro) {
        joao = joao + 0.025;
        pedro = pedro + 0.02;
        anos++;
    }

    document.write("João ficará mais alto que Pedro em " + anos + " anos.");
</script>

</body>
</html>
