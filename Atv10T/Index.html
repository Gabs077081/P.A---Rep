<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questão 10 - Controle de notas</title>
</head>
<body>

<script>
let notas = [];
let soma = 0;
let aprovados = 0;
let reprovados = 0;

for (let i = 0; i < 10; i++) {
    notas[i] = parseFloat(prompt("Digite a nota do aluno:"));

    soma = soma + notas[i];

    if (notas[i] >= 6) {
        aprovados++;
    } else {
        reprovados++;
    }
}

let media = soma / 10;

document.write("Notas dos alunos:<br>");

for (let i = 0; i < 10; i++) {
    document.write(notas[i] + "<br>");
}

document.write("<br>Média da turma: " + media);
document.write("<br>Aprovados: " + aprovados);
document.write("<br>Reprovados: " + reprovados);
</script>

</body>
</html>
