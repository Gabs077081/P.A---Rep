<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questão 1 - Cadastro de números</title>
</head>
<body>

<script>
let numeros = [];

for (let i = 0; i < 10; i++) {
    numeros[i] = parseInt(prompt("Digite um número:"));
}

document.write("Números digitados:<br>");

for (let i = 0; i < 10; i++) {
    document.write(numeros[i] + "<br>");
}
</script>

</body>
</html>
