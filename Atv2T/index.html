<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questão 2 - Soma dos elementos</title>
</head>
<body>

<script>
let numeros = [];
let soma = 0;

for (let i = 0; i < 10; i++) {
    numeros[i] = parseInt(prompt("Digite um número:"));
    soma = soma + numeros[i];
}

document.write("A soma dos números é: " + soma);
</script>

</body>
</html>
