<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questão 3 - Média dos valores</title>
</head>
<body>

<script>
let notas = [];
let soma = 0;

for (let i = 0; i < 8; i++) {
    notas[i] = parseFloat(prompt("Digite uma nota:"));
    soma = soma + notas[i];
}

let media = soma / 8;

document.write("A média das notas é: " + media);
</script>

</body>
</html>
