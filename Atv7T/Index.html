<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questão 7 - Vetor em ordem inversa</title>
</head>
<body>

<script>
let numeros = [];

for (let i = 0; i < 10; i++) {
    numeros[i] = parseInt(prompt("Digite um número:"));
}

document.write("Números em ordem inversa:<br>");

for (let i = 9; i >= 0; i--) {
    document.write(numeros[i] + "<br>");
}
</script>

</body>
</html>
