<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questão 8 - Positivos, negativos e zeros</title>
</head>
<body>

<script>
let numeros = [];
let positivos = 0;
let negativos = 0;
let zeros = 0;

for (let i = 0; i < 10; i++) {
    numeros[i] = parseInt(prompt("Digite um número:"));
}

for (let i = 0; i < 10; i++) {
    if (numeros[i] > 0) {
        positivos++;
    } else if (numeros[i] < 0) {
        negativos++;
    } else {
        zeros++;
    }
}

document.write("Positivos: " + positivos + "<br>");
document.write("Negativos: " + negativos + "<br>");
document.write("Zeros: " + zeros);
</script>

</body>
</html>
