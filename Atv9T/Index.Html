<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questão 9 - Comparação entre dois vetores</title>
</head>
<body>

<script>
let A = [];
let B = [];
let C = [];

for (let i = 0; i < 5; i++) {
    A[i] = parseInt(prompt("Digite um número para A:"));
}

for (let i = 0; i < 5; i++) {
    B[i] = parseInt(prompt("Digite um número para B:"));
}

for (let i = 0; i < 5; i++) {
    C[i] = A[i] + B[i];
}

document.write("Vetor A | Vetor B | Vetor C<br>");

for (let i = 0; i < 5; i++) {
    document.write(A[i] + " | " + B[i] + " | " + C[i] + "<br>");
}
</script>

</body>
</html>
